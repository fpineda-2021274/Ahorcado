<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AHORCADO</title>
    
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>AHORCADO</h1>
            <img class="logo-placeholder" src="https://placehold.co/80x80/4CAF50/FFFFFF?text=Logo" alt="Logo de AORCADO" />
        </div>

        <div class="main-game-area">
            <div class="game-status-and-clues">
                <div class="hangman-area">
                    <canvas id="hangman-canvas" class="hangman-canvas" width="200" height="250"></canvas>
                    <div id="timer-display" class="timer-display">00:00</div>
                </div>

                <div id="clues-section" class="clues-section">
                    <h2>Cualidades de la Palabra</h2>
                    <ul id="clues-list">
                        <li>Pista 1</li>
                        <li>Pista 2</li>
                        <li>Pista 3</li>
                    </ul>
                </div>
            </div>

            <div id="word-display" class="word-display"></div>
            <div id="message-box" class="message-box">Presiona "Iniciar Juego" para comenzar.</div>
            <div id="keyboard" class="keyboard"></div>

            <div class="control-buttons">
                <button id="start-btn" class="start-btn">Iniciar Juego</button>
                <button id="restart-btn" class="restart-btn" disabled>Reiniciar</button>
                <button id="pause-btn" class="pause-btn" disabled>Pausa</button>
                <button id="exit-btn" class="exit-btn">Salir</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
